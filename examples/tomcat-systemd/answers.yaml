# Example answers for a Tomcat started by systemd (no catalina.out: daily catalina.<date>.log / localhost.<date>.log,
# access log renamed by the AccessLogValve). The scan finds these logs itself (detect.json); answers only for
# what it cannot know. Logs elsewhere: services.tomcat.access_log / logs (globs, '-' = none), see docs/design.md.
#   amc plan --answers answers.yaml --detect-json detect.json
project: Shop online
checks:
  http:
    - url: http://127.0.0.1:8080/
      comment: Tomcat directly
    - url: https://shop.example.com/
      comment: users' URL
