# config.yaml = BASE configuration shipped by auto-mon-collector, identical on every host.
# Installed as /opt/monitoring/config/config.yaml. Host-specific parts are generated by `monitoring-agent`:
#   config/journal.yaml  kernel + sshd from the journal (fixed filters, masking), loaded before host.yaml
#   config/host.yaml  merged on top (maps merge, lists replace -> host.yaml carries full pipeline lists)
#   config/host.env   switches, no secrets (e.g. ORACLE_MON=on, ORACLE_SERVICE=orcl)
#   secrets/collector.env  root 600: OO_ENDPOINT, OO_AUTH, ORACLE_MON_PASSWORD (never printed)
#   config/site.d/*.yaml   optional operator overlay
#
# Discovery: receiver_creator + host_observer start a metric collector only when its port is listening here.
#   - host_observer runs as otelcol-contrib WITHOUT extra capabilities: it sees ports, not process names
#     (tested 2026-09-30) -> rules match on the port only.
#   - Endpoints below are STATIC (same labels as before); the port only decides on / off.
#   - resource_attributes with `...` templates silently stop the receiver (tested) -> never use them.
#   - host != "::1": the observer reports some ports twice (127.0.0.1 and ::1) -> one collector per service.
#   - Up checks (http_check / tcp_check) are NOT discovered: a check must keep running when the service is down.
#     They live in host.yaml.
# Validate: `monitoring-agent plan` (validate + smoke run with the installed collector binary).
extensions:
  # MONITORING_DATA: set by the systemd unit monitoring-collector (default <prefix>/data).
  file_storage:
    directory: ${env:MONITORING_DATA:-/opt/monitoring/data}/file_storage
  host_observer:
    refresh_interval: 30s

receivers:
  host_metrics:
    collection_interval: 60s
    scrapers:
      cpu:
      memory:
      load:
      disk:
      filesystem:
      network:
      paging:
      processes:
      system:       # system.uptime (seconds since boot)

  # Collector self-metrics (service.telemetry below): otelcol_exporter_send_failed_*, queue size, ...
  prometheus/otelcol:
    config:
      scrape_configs:
        - job_name: otelcol
          scrape_interval: 60s
          static_configs:
            - targets: ["127.0.0.1:8888"]

  # OTLP from apps on THIS host only: OpenTelemetry Java agent (traces), Spring Boot Micrometer (metrics).
  # 127.0.0.1 only = nothing reachable from the network. Idle on hosts without such apps.
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318

  # TCP connection counts per watched port, in / out (v0.19.0: built-in receiver, before: helper unit
  # monitoring-netconn). Ports: host.yaml (generated from the services found; default below).
  netconn:
    collection_interval: 30s
    ports: [1521, 8080, 443]

  # Top processes (v0.19.0: built-in receiver, before: helper unit monitoring-procs): every 60 s top 10 by CPU (over
  # 15 s, 100 = one core) and top 10 by RSS. Command names only, never arguments (/proc/<pid>/cmdline is never read).
  procs:
    collection_interval: 60s
    window: 15s
    top: 10

  # Kernel warnings (journald/kmsg) and SSH logins (journald/sshd): config/journal.yaml (v0.19.0, before: helper
  # units monitoring-kmsg / monitoring-sshd). The ssh pipeline below starts with transform/sshd (masking).

  # ---- Discovery: metric collectors ------------------------------------------------------------------------
  receiver_creator/metrics:
    watch_observers: [host_observer]
    receivers:
      # Tomcat / JVM via the JMX exporter javaagent (tomcat/jmx_exporter-tomcat.yml). Job name = old label.
      prometheus/tomcat:
        rule: type == "hostport" && port == 9404 && host != "::1"
        config:
          config:
            scrape_configs:
              - job_name: tomcat
                scrape_interval: 60s
                static_configs:
                  - targets: ["127.0.0.1:9404"]

      # Oracle: only where a monitoring user exists (ORACLE_MON=on + ORACLE_SERVICE in host.env,
      # ORACLE_MON_PASSWORD in the secrets file). Grants: oracle/grants.sql. No ASH/AWR.
      # Passwords: "${env:X}${env:FORCE_STRING:-}" (never set FORCE_STRING). A digits-only password would otherwise
      # become an int inside receiver_creator templates -> "got unconvertible type 'int'"; validate does not catch it.
      # Quotes or !!str do not help (tested 2026-10-02).
      oracledb:
        rule: type == "hostport" && port == 1521 && host != "::1" && "${env:ORACLE_MON:-off}" == "on"
        config:
          endpoint: localhost:1521
          service: ${env:ORACLE_SERVICE:-none}
          username: ${env:ORACLE_MON_USER:-otel_mon}
          password: "${env:ORACLE_MON_PASSWORD:-none}${env:FORCE_STRING:-}"
          collection_interval: 60s

      # Custom Oracle metrics. Oracle upper-cases column names, so every column has a quoted lower-case alias.
      # `$$` = literal `$` (v$$session -> v$session).
      sql_query/oracle:
        rule: type == "hostport" && port == 1521 && host != "::1" && "${env:ORACLE_MON:-off}" == "on"
        config:
          driver: oracle
          host: localhost
          port: 1521
          database: ${env:ORACLE_SERVICE:-none}
          username: ${env:ORACLE_MON_USER:-otel_mon}
          password: "${env:ORACLE_MON_PASSWORD:-none}${env:FORCE_STRING:-}"
          collection_interval: 60s
          timeout: 10s
          queries:
            # DB time by wait class (cumulative since instance start) -> use rate()
            - sql: |
                SELECT wait_class AS "wait_class", total_waits AS "waits", time_waited/100 AS "time_s"
                FROM v$$system_wait_class WHERE wait_class <> 'Idle'
              metrics:
                - metric_name: oracle.wait_class.waits
                  value_column: waits
                  attribute_columns: [wait_class]
                  data_type: sum
                  monotonic: true
                - metric_name: oracle.wait_class.time
                  value_column: time_s
                  value_type: double
                  unit: s
                  attribute_columns: [wait_class]
                  data_type: sum
                  monotonic: true
            # Active / blocked user sessions. Always 1 row, so 0 is reported (no gaps).
            - sql: |
                SELECT COUNT(*) AS "active",
                       NVL(SUM(CASE WHEN blocking_session IS NOT NULL THEN 1 ELSE 0 END), 0) AS "blocked",
                       NVL(MAX(CASE WHEN blocking_session IS NOT NULL THEN wait_time_micro END), 0)/1e6 AS "blocked_max_wait_s"
                FROM v$$session
                WHERE type = 'USER' AND status = 'ACTIVE'
                  AND NOT (state = 'WAITING' AND wait_class = 'Idle')
                  AND sid <> SYS_CONTEXT('USERENV','SID')
              metrics:
                - metric_name: oracle.sessions.active
                  value_column: active
                - metric_name: oracle.sessions.blocked
                  value_column: blocked
                - metric_name: oracle.sessions.blocked_max_wait
                  value_column: blocked_max_wait_s
                  value_type: double
                  unit: s
            # Active sessions by wait class (no rows when idle; that is normal)
            - sql: |
                SELECT CASE WHEN state = 'WAITING' THEN wait_class ELSE 'CPU' END AS "wait_class", COUNT(*) AS "active"
                FROM v$$session
                WHERE type = 'USER' AND status = 'ACTIVE'
                  AND NOT (state = 'WAITING' AND wait_class = 'Idle')
                  AND sid <> SYS_CONTEXT('USERENV','SID')
                GROUP BY CASE WHEN state = 'WAITING' THEN wait_class ELSE 'CPU' END
              metrics:
                - metric_name: oracle.sessions.active_by_wait_class
                  value_column: active
                  attribute_columns: [wait_class]
            # TEMP
            - sql: |
                SELECT tablespace_name AS "tablespace", tablespace_size AS "size_bytes",
                       tablespace_size - free_space AS "used_bytes"
                FROM dba_temp_free_space
              metrics:
                - metric_name: oracle.temp.size
                  value_column: size_bytes
                  unit: By
                  attribute_columns: [tablespace]
                - metric_name: oracle.temp.used
                  value_column: used_bytes
                  unit: By
                  attribute_columns: [tablespace]
            # UNDO, last hour (V$UNDOSTAT rows = 10-minute buckets)
            - sql: |
                SELECT NVL(MAX(maxquerylen), 0) AS "max_query_s",
                       NVL(SUM(ssolderrcnt), 0) AS "ora_01555",
                       NVL(SUM(nospaceerrcnt), 0) AS "no_space"
                FROM v$$undostat WHERE end_time > SYSDATE - 1/24
              metrics:
                - metric_name: oracle.undo.max_query_length_1h
                  value_column: max_query_s
                  unit: s
                - metric_name: oracle.undo.snapshot_too_old_1h
                  value_column: ora_01555
                - metric_name: oracle.undo.no_space_errors_1h
                  value_column: no_space
            # Current redo log sequence (instance-wide). Switches/hour = increase(oracle_redo_sequence[1h]).
            # Not a time filter: FIRST_TIME is UTC but SYSDATE in our session is UTC+5 (count was always 0).
            - sql: |
                SELECT NVL(MAX(sequence#), 0) AS "seq" FROM v$$log_history
              metrics:
                - metric_name: oracle.redo.sequence
                  value_column: seq
                  data_type: sum
                  monotonic: true

      # Scheduler job failures. Slower interval: scans DBA_SCHEDULER_JOB_RUN_DETAILS (~56k rows).
      sql_query/oracle_jobs:
        rule: type == "hostport" && port == 1521 && host != "::1" && "${env:ORACLE_MON:-off}" == "on"
        config:
          driver: oracle
          host: localhost
          port: 1521
          database: ${env:ORACLE_SERVICE:-none}
          username: ${env:ORACLE_MON_USER:-otel_mon}
          password: "${env:ORACLE_MON_PASSWORD:-none}${env:FORCE_STRING:-}"
          collection_interval: 300s
          timeout: 20s
          queries:
            # Total, always 1 row (0 when all jobs are fine)
            - sql: |
                SELECT COUNT(*) AS "failed" FROM dba_scheduler_job_run_details
                WHERE status <> 'SUCCEEDED' AND log_date > SYSTIMESTAMP - INTERVAL '1' HOUR
              metrics:
                - metric_name: oracle.scheduler.failed_runs_1h_total
                  value_column: failed
            # Per job (only jobs that failed)
            - sql: |
                SELECT owner AS "owner", job_name AS "job_name", COUNT(*) AS "failed"
                FROM dba_scheduler_job_run_details
                WHERE status <> 'SUCCEEDED' AND log_date > SYSTIMESTAMP - INTERVAL '1' HOUR
                GROUP BY owner, job_name
              metrics:
                - metric_name: oracle.scheduler.failed_runs_1h
                  value_column: failed
                  attribute_columns: [owner, job_name]

      # Connections dashboard, part 1: who is connected (session count per user/machine/program/status).
      # Part 2 (log snapshot) is in receiver_creator/logs below: one creator per signal.
      sql_query/oracle_sessions:
        rule: type == "hostport" && port == 1521 && host != "::1" && "${env:ORACLE_MON:-off}" == "on"
        config:
          driver: oracle
          host: localhost
          port: 1521
          database: ${env:ORACLE_SERVICE:-none}
          username: ${env:ORACLE_MON_USER:-otel_mon}
          password: "${env:ORACLE_MON_PASSWORD:-none}${env:FORCE_STRING:-}"
          collection_interval: 30s
          timeout: 10s
          queries:
            - sql: |
                SELECT NVL(username, '-') AS "username", NVL(machine, '-') AS "machine",
                       NVL(program, '-') AS "program", status AS "status", COUNT(*) AS "sessions"
                FROM v$$session
                WHERE type = 'USER' AND sid <> SYS_CONTEXT('USERENV','SID')
                GROUP BY username, machine, program, status
              metrics:
                - metric_name: oracle.sessions.by_client
                  value_column: sessions
                  attribute_columns: [username, machine, program, status]

      # CDB root (v0.4.0): only with ORACLE_CDB_SERVICE (answers services.oracle.cdb_service) and a COMMON monitoring
      # user (C##..., grants in the CDB root: V_$PDBS with CONTAINER_DATA, V_$DATABASE, V_$RESOURCE_LIMIT,
      # V_$RECOVERY_FILE_DEST). Only the root sees every PDB: a PDB in MOUNTED is invisible from inside a PDB.
      sql_query/oracle_cdb:
        rule: type == "hostport" && port == 1521 && host != "::1" && "${env:ORACLE_MON:-off}" == "on" && "${env:ORACLE_CDB_SERVICE:-off}" != "off"
        config:
          driver: oracle
          host: localhost
          port: 1521
          database: ${env:ORACLE_CDB_SERVICE:-none}
          username: ${env:ORACLE_MON_USER:-otel_mon}
          password: "${env:ORACLE_MON_PASSWORD:-none}${env:FORCE_STRING:-}"
          collection_interval: 60s
          timeout: 10s
          queries:
            # Every PDB except the seed: 1 = READ WRITE and not restricted (usable), 0 = MOUNTED / READ ONLY / RESTRICTED
            - sql: |
                SELECT name AS "pdb", open_mode AS "open_mode", NVL(restricted, 'NO') AS "restricted",
                       CASE WHEN open_mode = 'READ WRITE' AND NVL(restricted, 'NO') = 'NO' THEN 1 ELSE 0 END AS "open"
                FROM v$$pdbs WHERE name <> 'PDB$$SEED'
              metrics:
                - metric_name: oracle.pdb.open
                  value_column: open
                  attribute_columns: [pdb, open_mode, restricted]
            # Role (PRIMARY / PHYSICAL STANDBY), open mode, cdb (YES / NO): 1 row, value 1 (state in the attributes)
            - sql: |
                SELECT database_role AS "role", open_mode AS "open_mode", cdb AS "cdb", 1 AS "v" FROM v$$database
              metrics:
                - metric_name: oracle.database.state
                  value_column: v
                  attribute_columns: [role, open_mode, cdb]
            # processes / sessions vs their limit (V$RESOURCE_LIMIT is empty inside a PDB); UNLIMITED -> 0
            - sql: |
                SELECT resource_name AS "resource", current_utilization AS "current",
                       NVL(TO_NUMBER(DECODE(TRIM(limit_value), 'UNLIMITED', NULL, TRIM(limit_value))), 0) AS "limit"
                FROM v$$resource_limit WHERE resource_name IN ('processes', 'sessions')
              metrics:
                - metric_name: oracle.limit.current
                  value_column: current
                  attribute_columns: [resource]
                - metric_name: oracle.limit.max
                  value_column: limit
                  attribute_columns: [resource]
            # Fast recovery area (archive logs, backups): full = database hangs (ORA-00257). No FRA = 0 / 0.
            - sql: |
                SELECT NVL(SUM(space_limit), 0) AS "limit_b", NVL(SUM(space_used), 0) AS "used_b",
                       NVL(SUM(space_reclaimable), 0) AS "reclaimable_b"
                FROM v$$recovery_file_dest
              metrics:
                - metric_name: oracle.fra.limit
                  value_column: limit_b
                  unit: By
                - metric_name: oracle.fra.used
                  value_column: used_b
                  unit: By
                - metric_name: oracle.fra.reclaimable
                  value_column: reclaimable_b
                  unit: By

      # NON-CDB database (v0.8.0): the same role / limits / FRA queries as oracle_cdb, against the database itself
      # (ORACLE_SERVICE, the normal monitoring user; answers services.oracle.non_cdb). There is no V$PDBS here.
      # Grants: V_$DATABASE, V_$RESOURCE_LIMIT (works in a non-CDB), V_$RECOVERY_FILE_DEST.
      sql_query/oracle_db:
        rule: type == "hostport" && port == 1521 && host != "::1" && "${env:ORACLE_MON:-off}" == "on" && "${env:ORACLE_NONCDB:-off}" == "on"
        config:
          driver: oracle
          host: localhost
          port: 1521
          database: ${env:ORACLE_SERVICE:-none}
          username: ${env:ORACLE_MON_USER:-otel_mon}
          password: "${env:ORACLE_MON_PASSWORD:-none}${env:FORCE_STRING:-}"
          collection_interval: 60s
          timeout: 10s
          queries:
            # Role (PRIMARY / PHYSICAL STANDBY), open mode, cdb (YES / NO): 1 row, value 1 (state in the attributes)
            - sql: |
                SELECT database_role AS "role", open_mode AS "open_mode", cdb AS "cdb", 1 AS "v" FROM v$$database
              metrics:
                - metric_name: oracle.database.state
                  value_column: v
                  attribute_columns: [role, open_mode, cdb]
            # processes / sessions vs their limit (V$RESOURCE_LIMIT is empty inside a PDB); UNLIMITED -> 0
            - sql: |
                SELECT resource_name AS "resource", current_utilization AS "current",
                       NVL(TO_NUMBER(DECODE(TRIM(limit_value), 'UNLIMITED', NULL, TRIM(limit_value))), 0) AS "limit"
                FROM v$$resource_limit WHERE resource_name IN ('processes', 'sessions')
              metrics:
                - metric_name: oracle.limit.current
                  value_column: current
                  attribute_columns: [resource]
                - metric_name: oracle.limit.max
                  value_column: limit
                  attribute_columns: [resource]
            # Fast recovery area (archive logs, backups): full = database hangs (ORA-00257). No FRA = 0 / 0.
            - sql: |
                SELECT NVL(SUM(space_limit), 0) AS "limit_b", NVL(SUM(space_used), 0) AS "used_b",
                       NVL(SUM(space_reclaimable), 0) AS "reclaimable_b"
                FROM v$$recovery_file_dest
              metrics:
                - metric_name: oracle.fra.limit
                  value_column: limit_b
                  unit: By
                - metric_name: oracle.fra.used
                  value_column: used_b
                  unit: By
                - metric_name: oracle.fra.reclaimable
                  value_column: reclaimable_b
                  unit: By

      # Data Guard (v0.9.0, answers services.oracle.data_guard): apply / transport lag in seconds from V$DATAGUARD_STATS
      # (on the STANDBY; the monitoring user must be able to log in there = Active Data Guard / read only).
      # Grant: V_$DATAGUARD_STATS. A lag value NULL (not computed yet) = -1.
      sql_query/oracle_dg:
        rule: type == "hostport" && port == 1521 && host != "::1" && "${env:ORACLE_MON:-off}" == "on" && "${env:ORACLE_DG:-off}" == "on"
        config:
          driver: oracle
          host: localhost
          port: 1521
          database: ${env:ORACLE_DB_SERVICE:-none}
          username: ${env:ORACLE_MON_USER:-otel_mon}
          password: "${env:ORACLE_MON_PASSWORD:-none}${env:FORCE_STRING:-}"
          collection_interval: 60s
          timeout: 10s
          queries:
            - sql: |
                SELECT REPLACE(name, ' ', '_') AS "kind",
                       NVL(EXTRACT(DAY FROM TO_DSINTERVAL(value)) * 86400 + EXTRACT(HOUR FROM TO_DSINTERVAL(value)) * 3600
                         + EXTRACT(MINUTE FROM TO_DSINTERVAL(value)) * 60 + EXTRACT(SECOND FROM TO_DSINTERVAL(value)), -1) AS "seconds"
                FROM v$$dataguard_stats WHERE name IN ('apply lag', 'transport lag')
              metrics:
                - metric_name: oracle.dataguard.lag
                  value_column: seconds
                  value_type: double
                  unit: s
                  attribute_columns: [kind]

      # RMAN backups (v0.9.0, answers services.oracle.backups): hours since the last COMPLETED job per input type
      # (DB FULL, DB INCR, ARCHIVELOG, ...) and failed jobs in the last 24 h. Grant: V_$RMAN_BACKUP_JOB_DETAILS.
      # Times: SYSDATE and END_TIME are both the database's clock (no time-zone mix as with V$LOG_HISTORY: CHECK on
      # the first host). Every 5 min: the view is small but not free.
      sql_query/oracle_backup:
        rule: type == "hostport" && port == 1521 && host != "::1" && "${env:ORACLE_MON:-off}" == "on" && "${env:ORACLE_BACKUP:-off}" == "on"
        config:
          driver: oracle
          host: localhost
          port: 1521
          database: ${env:ORACLE_DB_SERVICE:-none}
          username: ${env:ORACLE_MON_USER:-otel_mon}
          password: "${env:ORACLE_MON_PASSWORD:-none}${env:FORCE_STRING:-}"
          collection_interval: 300s
          timeout: 20s
          queries:
            - sql: |
                SELECT input_type AS "type", ROUND((SYSDATE - MAX(end_time)) * 24, 2) AS "age_h"
                FROM v$$rman_backup_job_details WHERE status = 'COMPLETED' AND end_time IS NOT NULL GROUP BY input_type
              metrics:
                - metric_name: oracle.backup.age
                  value_column: age_h
                  value_type: double
                  unit: h
                  attribute_columns: [type]
            - sql: |
                SELECT COUNT(*) AS "failed" FROM v$$rman_backup_job_details
                WHERE status LIKE 'FAILED%' AND start_time > SYSDATE - 1
              metrics:
                - metric_name: oracle.backup.failed_24h
                  value_column: failed

      # Redis. REDIS_MON=off in host.env disables it, REDIS_PORT for a non-standard port.
      redis:
        rule: type == "hostport" && port == ${env:REDIS_PORT:-6379} && host != "::1" && "${env:REDIS_MON:-on}" != "off"
        config:
          endpoint: 127.0.0.1:${env:REDIS_PORT:-6379}
          password: "${env:REDIS_PASSWORD:-}${env:FORCE_STRING:-}"
          collection_interval: 60s

      # Caddy: Prometheus metrics on the admin endpoint 127.0.0.1:2019/metrics.
      prometheus/caddy:
        rule: type == "hostport" && port == 2019 && host != "::1"
        config:
          config:
            scrape_configs:
              - job_name: caddy
                scrape_interval: 60s
                static_configs:
                  - targets: ["127.0.0.1:2019"]

  # ---- Discovery: log collectors ---------------------------------------------------------------------------
  receiver_creator/logs:
    watch_observers: [host_observer]
    receivers:
      # Connections dashboard, part 2: snapshot of active + blocked + blocking sessions (one log record per
      # session per poll, stream oracle_sessions). sql_query logs output is "development" stability.
      # Log attributes arrive as strings -> try_cast() in OpenObserve SQL. NVL everywhere (NULL-safe).
      sql_query/oracle_sessions:
        rule: type == "hostport" && port == 1521 && host != "::1" && "${env:ORACLE_MON:-off}" == "on"
        config:
          driver: oracle
          host: localhost
          port: 1521
          database: ${env:ORACLE_SERVICE:-none}
          username: ${env:ORACLE_MON_USER:-otel_mon}
          password: "${env:ORACLE_MON_PASSWORD:-none}${env:FORCE_STRING:-}"
          collection_interval: 30s
          timeout: 10s
          queries:
            - sql: |
                SELECT s.sid || ',' || s.serial# AS "session",
                       NVL(s.username, '-') AS "username", NVL(s.osuser, '-') AS "osuser",
                       NVL(s.machine, '-') AS "machine", NVL(s.program, '-') AS "program",
                       NVL(s.module, '-') AS "module", NVL(s.action, '-') AS "action",
                       NVL(s.client_identifier, '-') AS "client_id", s.status AS "status",
                       NVL(s.sql_id, '-') AS "sql_id",
                       CASE WHEN s.state = 'WAITING' THEN s.event ELSE 'ON CPU' END AS "event",
                       CASE WHEN s.state = 'WAITING' THEN s.wait_class ELSE 'CPU' END AS "wait_class",
                       CASE WHEN s.state = 'WAITING' THEN ROUND(s.wait_time_micro / 1e6, 1) ELSE 0 END AS "wait_s",
                       s.last_call_et AS "in_status_s",
                       NVL(TO_CHAR(s.blocking_session), '-') AS "blocked_by",
                       CASE WHEN b.blocker IS NOT NULL THEN 'yes' ELSE 'no' END AS "is_blocker",
                       TO_CHAR(s.logon_time, 'YYYY-MM-DD HH24:MI:SS') AS "logon_time",
                       NVL(s.username, '-') || '@' || NVL(s.machine, '-') || ' ' || NVL(s.module, NVL(s.program, '-'))
                         || ' | ' || CASE WHEN s.state = 'WAITING' THEN s.event ELSE 'ON CPU' END
                         || ' | sql ' || NVL(s.sql_id, '-') AS "summary"
                FROM v$$session s
                LEFT JOIN (SELECT DISTINCT blocking_session AS blocker FROM v$$session
                           WHERE blocking_session IS NOT NULL) b ON b.blocker = s.sid
                WHERE s.type = 'USER' AND s.sid <> SYS_CONTEXT('USERENV','SID')
                  AND NVL(s.program, '-') NOT IN ('otelcol-contrib', 'monitoring-collector')   -- our own monitoring queries = noise
                  AND (   (s.status = 'ACTIVE' AND NOT (s.state = 'WAITING' AND s.wait_class = 'Idle'))
                       OR s.blocking_session IS NOT NULL
                       OR b.blocker IS NOT NULL)
              logs:
                - body_column: summary
                  attribute_columns: [session, username, osuser, machine, program, module, action, client_id,
                                      status, sql_id, event, wait_class, wait_s, in_status_s, blocked_by,
                                      is_blocker, logon_time]

  # ---- Oracle capacity (v0.22.0, answers services.oracle.capacity): which TABLES take the space, in table terms.
  # Segments fold into the owning table (indexes via DBA_INDEXES, LOB segment + LOB index via DBA_LOBS, partitions by
  # name); Oracle-maintained schemas are left out. One log record per row -> stream oracle_capacity, attribute `kind`
  # = table | tablespace | partition_waste | recyclebin (every 6 h), file + file_hwm (once a day: DBA_EXTENTS is slow). Growth = difference between snapshots (read side). Grants: DBA_SEGMENTS, DBA_INDEXES, DBA_LOBS,
  # DBA_TABLES, DBA_FREE_SPACE, DBA_USERS, DBA_RECYCLEBIN, DBA_PART_TABLES, DBA_TAB_PARTITIONS, DBA_EXTENTS,
  # DBA_TEMP_FILES (+ DBA_TABLESPACES, DBA_DATA_FILES). Bytes are numbers; log attributes arrive as strings.
  receiver_creator/capacity:
    watch_observers: [host_observer]
    receivers:
      sql_query/oracle_capacity:
        rule: type == "hostport" && port == 1521 && host != "::1" && "${env:ORACLE_MON:-off}" == "on" && "${env:ORACLE_CAPACITY:-off}" == "on"
        config:
          driver: oracle
          host: localhost
          port: 1521
          database: ${env:ORACLE_SERVICE:-none}
          username: ${env:ORACLE_MON_USER:-otel_mon}
          password: "${env:ORACLE_MON_PASSWORD:-none}${env:FORCE_STRING:-}"
          collection_interval: 6h
          timeout: 900s   # the whole scrape: the table query ran > 120 s on a big non-CDB (v0.22.1)
          queries:
            # top 50 tables (data + indexes + LOBs + partitions) + one "(others)" row with the rest
            - sql: |
                SELECT 'table' AS "kind", SYS_CONTEXT('USERENV', 'CON_NAME') AS "container",
                       MAX(CASE WHEN a.rn <= 50 THEN a.owner ELSE '(others)' END) AS "owner",
                       MAX(CASE WHEN a.rn <= 50 THEN a.tname ELSE '(others)' END) AS "table_name",
                       SUM(a.total_b) AS "total_b", SUM(a.data_b) AS "data_b", SUM(a.index_b) AS "index_b",
                       SUM(a.lob_b) AS "lob_b", SUM(a.data_segs) AS "data_segments", COUNT(*) AS "tables",
                       NVL(SUM(CASE WHEN a.rn <= 50 THEN t.num_rows END), -1) AS "num_rows",
                       NVL(MAX(CASE WHEN a.rn <= 50 THEN TO_CHAR(t.last_analyzed, 'YYYY-MM-DD') END), '-') AS "last_analyzed",
                       MAX(CASE WHEN a.rn <= 50 THEN a.owner || '.' || a.tname ELSE '(others)' END) || ' '
                         || TO_CHAR(ROUND(SUM(a.total_b) / 1073741824, 2), 'FM9999990.00') || ' GB' AS "summary"
                FROM (SELECT x.owner, x.tname, SUM(x.bytes) AS total_b,
                             NVL(SUM(CASE WHEN x.k = 'D' THEN x.bytes END), 0) AS data_b,
                             NVL(SUM(CASE WHEN x.k = 'I' THEN x.bytes END), 0) AS index_b,
                             NVL(SUM(CASE WHEN x.k = 'L' THEN x.bytes END), 0) AS lob_b,
                             NVL(SUM(CASE WHEN x.k = 'D' THEN 1 END), 0) AS data_segs,
                             ROW_NUMBER() OVER (ORDER BY SUM(x.bytes) DESC) AS rn
                      FROM (SELECT s.owner, s.segment_name AS tname, 'D' AS k, s.bytes FROM dba_segments s
                             WHERE s.segment_type IN ('TABLE', 'TABLE PARTITION', 'TABLE SUBPARTITION')
                            UNION ALL
                            SELECT i.table_owner, i.table_name, 'I', s.bytes FROM dba_segments s
                              JOIN dba_indexes i ON i.owner = s.owner AND i.index_name = s.segment_name
                             WHERE s.segment_type IN ('INDEX', 'INDEX PARTITION', 'INDEX SUBPARTITION')
                            UNION ALL
                            SELECT l.owner, l.table_name, 'L', s.bytes FROM dba_segments s
                              JOIN dba_lobs l ON l.owner = s.owner AND s.segment_name IN (l.segment_name, l.index_name)
                             WHERE s.segment_type IN ('LOBSEGMENT', 'LOBINDEX', 'LOB PARTITION', 'LOB SUBPARTITION')) x
                      WHERE x.owner NOT IN (SELECT username FROM dba_users WHERE oracle_maintained = 'Y')
                      GROUP BY x.owner, x.tname) a
                LEFT JOIN dba_tables t ON t.owner = a.owner AND t.table_name = a.tname
                GROUP BY LEAST(a.rn, 51)
              logs:
                - body_column: summary
                  attribute_columns: [kind, container, owner, table_name, total_b, data_b, index_b, lob_b,
                                      data_segments, tables, num_rows, last_analyzed]
            # per tablespace: allocated in files, used, free INSIDE the files (= allocated - used), max (autoextend
            # limit). Used comes from DBA_TABLESPACE_USAGE_METRICS: DBA_FREE_SPACE ran > 120 s for the monitoring
            # user on a real PDB (v0.22.0, cancelled by the timeout), the metrics view answers at once.
            - sql: |
                SELECT 'tablespace' AS "kind", SYS_CONTEXT('USERENV', 'CON_NAME') AS "container",
                       d.tablespace_name AS "tablespace", d.alloc_b AS "allocated_b",
                       NVL(m.used_space, 0) * ts.block_size AS "used_b",
                       GREATEST(d.alloc_b - NVL(m.used_space, 0) * ts.block_size, 0) AS "free_b", d.max_b AS "max_b",
                       d.tablespace_name || ' allocated ' || TO_CHAR(ROUND(d.alloc_b / 1073741824, 2), 'FM9999990.00')
                         || ' GB, free inside '
                         || TO_CHAR(ROUND(GREATEST(d.alloc_b - NVL(m.used_space, 0) * ts.block_size, 0) / 1073741824, 2), 'FM9999990.00')
                         || ' GB' AS "summary"
                FROM (SELECT tablespace_name, SUM(bytes) AS alloc_b,
                             SUM(CASE WHEN autoextensible = 'YES' THEN GREATEST(bytes, maxbytes) ELSE bytes END) AS max_b
                        FROM dba_data_files GROUP BY tablespace_name) d
                JOIN dba_tablespaces ts ON ts.tablespace_name = d.tablespace_name
                LEFT JOIN dba_tablespace_usage_metrics m ON m.tablespace_name = d.tablespace_name
              logs:
                - body_column: summary
                  attribute_columns: [kind, container, tablespace, allocated_b, used_b, free_b, max_b]
            # partitioned tables that waste space: many partition segments (8 MB minimum each) for few rows; top 20
            - sql: |
                SELECT 'partition_waste' AS "kind", SYS_CONTEXT('USERENV', 'CON_NAME') AS "container",
                       t.owner AS "owner", t.table_name AS "table_name", p.partitioning_type AS "partitioning",
                       p.partition_count AS "partitions", NVL(t.num_rows, -1) AS "num_rows", s.bytes AS "size_b",
                       s.segs AS "segments",
                       t.owner || '.' || t.table_name || ' ' || ROUND(s.bytes / 1048576) || ' MB in ' || s.segs
                         || ' partition segments for ' || NVL(TO_CHAR(t.num_rows), '?') || ' rows' AS "summary"
                FROM dba_tables t
                JOIN dba_part_tables p ON p.owner = t.owner AND p.table_name = t.table_name
                JOIN (SELECT owner, segment_name, SUM(bytes) AS bytes, COUNT(*) AS segs FROM dba_segments
                       WHERE segment_type IN ('TABLE PARTITION', 'TABLE SUBPARTITION') GROUP BY owner, segment_name) s
                  ON s.owner = t.owner AND s.segment_name = t.table_name
                WHERE t.owner NOT IN (SELECT username FROM dba_users WHERE oracle_maintained = 'Y') AND s.segs >= 10
                ORDER BY s.bytes - NVL(t.num_rows, 0) * 200 DESC
                FETCH FIRST 20 ROWS ONLY
              logs:
                - body_column: summary
                  attribute_columns: [kind, container, owner, table_name, partitioning, partitions, num_rows,
                                      size_b, segments]
            # recycle bin: dropped objects that still hold space (per owner + tablespace); no rows = nothing held
            - sql: |
                SELECT 'recyclebin' AS "kind", SYS_CONTEXT('USERENV', 'CON_NAME') AS "container",
                       r.owner AS "owner", r.ts_name AS "tablespace", COUNT(*) AS "objects",
                       NVL(SUM(r.space * ts.block_size), 0) AS "size_b",
                       r.owner || ' in ' || r.ts_name || ': ' || COUNT(*) || ' dropped objects, '
                         || ROUND(NVL(SUM(r.space * ts.block_size), 0) / 1048576) || ' MB' AS "summary"
                FROM dba_recyclebin r JOIN dba_tablespaces ts ON ts.tablespace_name = r.ts_name
                GROUP BY r.owner, r.ts_name
              logs:
                - body_column: summary
                  attribute_columns: [kind, container, owner, tablespace, objects, size_b]
      # data + temp files with the high-water mark: what a RESIZE could give back (reclaim_b). Once a day.
      sql_query/oracle_capacity_files:
        rule: type == "hostport" && port == 1521 && host != "::1" && "${env:ORACLE_MON:-off}" == "on" && "${env:ORACLE_CAPACITY:-off}" == "on"
        config:
          driver: oracle
          host: localhost
          port: 1521
          database: ${env:ORACLE_SERVICE:-none}
          username: ${env:ORACLE_MON_USER:-otel_mon}
          password: "${env:ORACLE_MON_PASSWORD:-none}${env:FORCE_STRING:-}"
          # the whole scrape: DBA_EXTENTS did not finish in 300 s for the monitoring user on a real PDB (v0.22.0)
          collection_interval: 24h
          timeout: 900s
          queries:
            # 1. data + temp files: size, autoextend, max (fast; first, so a slow query 2 cannot take it down)
            - sql: |
                SELECT 'file' AS "kind", SYS_CONTEXT('USERENV', 'CON_NAME') AS "container", 'data' AS "file_type",
                       f.file_name AS "file", f.tablespace_name AS "tablespace", f.bytes AS "size_b",
                       f.autoextensible AS "autoextend", f.maxbytes AS "max_b",
                       f.file_name || ' ' || TO_CHAR(ROUND(f.bytes / 1073741824, 2), 'FM9999990.00') || ' GB' AS "summary"
                FROM dba_data_files f
                UNION ALL
                SELECT 'file', SYS_CONTEXT('USERENV', 'CON_NAME'), 'temp', f.file_name, f.tablespace_name, f.bytes,
                       f.autoextensible, f.maxbytes,
                       f.file_name || ' ' || TO_CHAR(ROUND(f.bytes / 1073741824, 2), 'FM9999990.00') || ' GB (temp)'
                FROM dba_temp_files f
              logs:
                - body_column: summary
                  attribute_columns: [kind, container, file_type, file, tablespace, size_b, autoextend, max_b]
            # 2. high-water mark per data file: what a RESIZE could give back (reclaim_b). Slow (DBA_EXTENTS).
            - sql: |
                SELECT 'file_hwm' AS "kind", SYS_CONTEXT('USERENV', 'CON_NAME') AS "container",
                       f.file_name AS "file", f.tablespace_name AS "tablespace", f.bytes AS "size_b",
                       NVL(h.hwm_blocks, 1) * ts.block_size AS "hwm_b",
                       GREATEST(f.bytes - NVL(h.hwm_blocks, 1) * ts.block_size, 0) AS "reclaim_b",
                       f.file_name || ' resize could give back '
                         || TO_CHAR(ROUND(GREATEST(f.bytes - NVL(h.hwm_blocks, 1) * ts.block_size, 0) / 1073741824, 2), 'FM9999990.00')
                         || ' GB' AS "summary"
                FROM dba_data_files f
                JOIN dba_tablespaces ts ON ts.tablespace_name = f.tablespace_name
                LEFT JOIN (SELECT file_id, MAX(block_id + blocks - 1) AS hwm_blocks FROM dba_extents GROUP BY file_id) h
                       ON h.file_id = f.file_id
              logs:
                - body_column: summary
                  attribute_columns: [kind, container, file, tablespace, size_b, hwm_b, reclaim_b]

processors:
  resource_detection:
    # env: OTEL_RESOURCE_ATTRIBUTES from host.env (e.g. project=..., set by monitoring-agent from answers.yaml); empty = nothing
    detectors: [env, system]
    system:
      hostname_sources: [os]
  batch:
  # Traces pipeline only. Measures the whole collector process; above the soft limit (limit - spike = 450 MiB)
  # new spans are refused, so traces can never take memory from metrics / logs.
  memory_limiter:
    check_interval: 1s
    limit_mib: 600
    spike_limit_mib: 150
  # Privacy: query strings may contain customer data (semconv: server spans url.query, client spans url.full).
  # SQL is masked by the Java agent itself (values -> ?). [?] instead of \? = no escaping in OTTL strings.
  transform/traces_privacy:
    error_mode: ignore
    trace_statements:
      - delete_key(span.attributes, "url.query")
      - replace_pattern(span.attributes["url.full"], "[?].*", "")
  # Keep every trace with an error, every trace slower than 2 s, and 5% of the rest (decision after 10 s).
  # Works because one collector sees all spans of a trace (single host).
  tail_sampling:
    decision_wait: 10s
    num_traces: 5000
    expected_new_traces_per_sec: 10
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: slow
        type: latency
        latency:
          threshold_ms: 2000
      - name: baseline
        type: probabilistic
        probabilistic:
          sampling_percentage: 5

# All exporters: queue on disk (survives OpenObserve outage + collector restart),
# retry up to 1h instead of the default 5 min. queue_size = batches (default sizer: requests).
exporters:
  otlp_http/openobserve:
    endpoint: ${env:OO_ENDPOINT}
    compression: gzip
    headers:
      Authorization: ${env:OO_AUTH}
      stream-name: default
    sending_queue:
      storage: file_storage
      queue_size: 1000
    retry_on_failure:
      max_elapsed_time: 1h

  otlp_http/openobserve_logs:
    endpoint: ${env:OO_ENDPOINT}
    compression: gzip
    headers:
      Authorization: ${env:OO_AUTH}
      stream-name: tomcat
    sending_queue:
      storage: file_storage
      queue_size: 1000
    retry_on_failure:
      max_elapsed_time: 1h

  otlp_http/openobserve_oracle_logs:
    endpoint: ${env:OO_ENDPOINT}
    compression: gzip
    headers:
      Authorization: ${env:OO_AUTH}
      stream-name: oracle
    sending_queue:
      storage: file_storage
      queue_size: 1000
    retry_on_failure:
      max_elapsed_time: 1h

  otlp_http/openobserve_oracle_sessions:
    endpoint: ${env:OO_ENDPOINT}
    compression: gzip
    headers:
      Authorization: ${env:OO_AUTH}
      stream-name: oracle_sessions
    sending_queue:
      storage: file_storage
      queue_size: 1000
    retry_on_failure:
      max_elapsed_time: 1h

  otlp_http/openobserve_oracle_capacity:
    endpoint: ${env:OO_ENDPOINT}
    compression: gzip
    headers:
      Authorization: ${env:OO_AUTH}
      stream-name: oracle_capacity
    sending_queue:
      storage: file_storage
      queue_size: 1000
    retry_on_failure:
      max_elapsed_time: 1h

  otlp_http/openobserve_netconn:
    endpoint: ${env:OO_ENDPOINT}
    compression: gzip
    headers:
      Authorization: ${env:OO_AUTH}
      stream-name: netconn
    sending_queue:
      storage: file_storage
      queue_size: 1000
    retry_on_failure:
      max_elapsed_time: 1h

  otlp_http/openobserve_kernel:
    endpoint: ${env:OO_ENDPOINT}
    compression: gzip
    headers:
      Authorization: ${env:OO_AUTH}
      stream-name: kernel
    sending_queue:
      storage: file_storage
      queue_size: 1000
    retry_on_failure:
      max_elapsed_time: 1h

  otlp_http/openobserve_processes:
    endpoint: ${env:OO_ENDPOINT}
    compression: gzip
    headers:
      Authorization: ${env:OO_AUTH}
      stream-name: processes
    sending_queue:
      storage: file_storage
      queue_size: 1000
    retry_on_failure:
      max_elapsed_time: 1h

  otlp_http/openobserve_ssh:
    endpoint: ${env:OO_ENDPOINT}
    compression: gzip
    headers:
      Authorization: ${env:OO_AUTH}
      stream-name: ssh
    sending_queue:
      storage: file_storage
      queue_size: 1000
    retry_on_failure:
      max_elapsed_time: 1h

service:
  telemetry:
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 8888
  extensions: [file_storage, host_observer]
  # Base pipelines. host.yaml replaces `metrics` / adds `logs`, `logs/oracle` with the host's receivers.
  pipelines:
    metrics:
      receivers: [host_metrics, prometheus/otelcol, otlp, receiver_creator/metrics]
      processors: [resource_detection, batch]
      exporters: [otlp_http/openobserve]
    logs/oracle_sessions:
      receivers: [receiver_creator/logs]
      processors: [resource_detection, batch]
      exporters: [otlp_http/openobserve_oracle_sessions]
    logs/oracle_capacity:
      receivers: [receiver_creator/capacity]
      processors: [resource_detection, batch]
      exporters: [otlp_http/openobserve_oracle_capacity]
    logs/netconn:
      receivers: [netconn]
      processors: [resource_detection, batch]
      exporters: [otlp_http/openobserve_netconn]
    logs/kernel:
      receivers: [journald/kmsg]
      processors: [resource_detection, batch]
      exporters: [otlp_http/openobserve_kernel]
    logs/processes:
      receivers: [procs]
      processors: [resource_detection, batch]
      exporters: [otlp_http/openobserve_processes]
    logs/ssh:
      receivers: [journald/sshd]
      processors: [transform/sshd, resource_detection, batch]   # transform/sshd FIRST: masking before the queue
      exporters: [otlp_http/openobserve_ssh]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, transform/traces_privacy, tail_sampling, batch]
      exporters: [otlp_http/openobserve]
