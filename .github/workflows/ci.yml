# CI: every push and pull request. No secrets needed.
name: ci
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call: # release.yml runs every check before a release
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: No CRLF (scripts and configs go to Linux servers)
        run: |
          bad=$(git ls-files --eol | awk '$1 ~ /crlf/ || $2 ~ /crlf/ {print $NF}')
          [ -z "$bad" ] || { echo "CRLF in: $bad"; exit 1; }
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          [ -z "$out" ] || { echo "run gofmt on: $out"; exit 1; }
      - name: vet + test
        run: |
          go vet ./...
          go test -race ./...
      - name: Build static binaries (linux amd64 + arm64)
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "dist/amc-linux-$arch" ./cmd/amc
          done
          file dist/*
          ./dist/amc-linux-amd64 version
      - name: get.sh trust chain (throwaway key; good / tampered binary / tampered sums / other key)
        run: |
          set -euo pipefail
          die() { echo "::error::$*"; exit 1; }
          k=$RUNNER_TEMP/keys; mkdir -p "$k"
          openssl ecparam -name prime256v1 -genkey -noout -out "$k/test.pem"
          openssl ec -in "$k/test.pem" -pubout -out "$k/test.pub" 2> /dev/null
          openssl ecparam -name prime256v1 -genkey -noout -out "$k/other.pem"
          release() { # release DIR SIGNKEY: a local "GitHub release"
            mkdir -p "$1"; cp dist/amc-linux-amd64 dist/amc-linux-arm64 "$1/"
            scripts/render-get.sh "$k/test.pub" "$1/get.sh"
            (cd "$1" && sha256sum amc-linux-amd64 amc-linux-arm64 get.sh > SHA256SUMS)
            openssl dgst -sha256 -sign "$2" -out "$1/SHA256SUMS.sig" "$1/SHA256SUMS"
          }
          w=$RUNNER_TEMP/www
          release "$w/good" "$k/test.pem"
          release "$w/bin" "$k/test.pem";   echo x >> "$w/bin/amc-linux-amd64"         # binary changed after signing
          release "$w/sums" "$k/test.pem";  echo x >> "$w/sums/amc-linux-amd64"
          (cd "$w/sums" && sha256sum amc-linux-amd64 amc-linux-arm64 get.sh > SHA256SUMS)      # sums re-made, old signature
          release "$w/other" "$k/other.pem"                                                    # signed by somebody else
          python3 -m http.server 8098 -d "$w" -b 127.0.0.1 > /dev/null 2>&1 &
          sleep 1
          shellcheck --severity=warning "$w/good/get.sh"
          # rc captured explicitly: under set -e a failing $(...) would end the step without any output
          set +e; out=$(AMC_BASE_URL_FOR_TESTS=http://127.0.0.1:8098/good bash "$w/good/get.sh" version 2>&1); rc=$?; set -e
          echo "good: rc=$rc $out"
          [ "$rc" -eq 0 ] && grep -q 'signature and sha256 verified' <<< "$out" && grep -q '^auto-mon-collector ' <<< "$out" || die "good release did not run"
          for case in bin:"CHECKSUM MISMATCH" sums:"SIGNATURE CHECK FAILED" other:"SIGNATURE CHECK FAILED"; do
            set +e; out=$(AMC_BASE_URL_FOR_TESTS=http://127.0.0.1:8098/${case%%:*} bash "$w/good/get.sh" version 2>&1); rc=$?; set -e
            echo "${case%%:*}: rc=$rc $out"
            [ "$rc" -eq 3 ] && grep -q "${case#*:}" <<< "$out" || die "${case%%:*}: tampered release not refused"
            ! grep -q '^auto-mon-collector ' <<< "$out" || die "${case%%:*}: amc ran although the check failed"
          done
      - name: End to end on this runner (real collector, systemd, ACLs; fake backend and secrets)
        run: |
          sudo apt-get install -y -qq acl > /dev/null
          alert=/u01/app/oracle/diag/rdbms/orcl/ORCL/trace/alert_ORCL.log
          sudo install -d -m 750 "$(dirname "$alert")" && echo "2026-10-05T10:00:00.000000+00:00" | sudo tee "$alert" > /dev/null
          sudo chmod 640 "$alert"                         # root only: amc must grant the collector an ACL
          sudo install -d -m 700 /opt/monitoring/secrets
          printf "OO_ENDPOINT='http://127.0.0.1:9'\nOO_AUTH='Basic fake'\nORACLE_MON_PASSWORD='123456'\n" \
            | sudo tee /opt/monitoring/secrets/collector.env > /dev/null
          sudo chmod 600 /opt/monitoring/secrets/collector.env
          # Every check stops the job on its own line: in `bash -e` a failure inside `a && b` does NOT stop the
          # script (the first version of this step went green although validate had failed).
          set -euo pipefail
          die()  { echo "::error::$*"; exit 1; }
          must() { grep -q -- "$1" "$2" || die "missing '$1' in $2"; }
          amc=./dist/amc-linux-amd64
          # Fake services on the discovery ports, so receiver_creator really builds its templates in the smoke
          # run (with the digits-only test password: the int bug that validate cannot see). Accept + close at
          # once: a listener that never answers can hang a collector's shutdown.
          python3 - <<'PY' &
          import select, socket
          socks = []
          for p in (1521, 9404, 2019, 6379):
              s = socket.socket(); s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
              s.bind(("127.0.0.1", p)); s.listen(16); socks.append(s)
          while True:
              for s in select.select(socks, [], [], 60)[0]:
                  s.accept()[0].close()
          PY
          sleep 2
          echo "::group::plan (check mode)"
          sudo $amc plan --host-dir examples/oracle-db | tee plan1.txt   # pipefail: amc's exit code counts
          echo "::endgroup::"
          must 'validate: VALID' plan1.txt
          must 'no load / start errors' plan1.txt
          must '[1-9][0-9]* discovered receivers' plan1.txt    # the templates were really built
          must 'CHECK done: 0 failures' plan1.txt
          if [ -e /etc/systemd/system/monitoring-otelcol.service ] || [ -e /opt/monitoring/config ]; then die "plan changed the system"; fi
          # A GENERATED host part (detect.json + answers: Oracle + Tomcat + HTTP checks) must pass the real
          # collector too: validate + smoke run with every receiver block the generator writes.
          echo "::group::plan with a generated host part"
          sudo $amc plan --answers examples/app-host/answers.yaml --detect-json examples/app-host/detect.json | tee plan-gen.txt
          echo "::endgroup::"
          must 'monitoring: oracle, tomcat' plan-gen.txt
          must 'validate: VALID' plan-gen.txt
          must 'no load / start errors' plan-gen.txt
          # v0.4.0: the CDB root block is switched on in this example (so the smoke run above built it too)
          $amc generate --answers examples/app-host/answers.yaml --detect-json examples/app-host/detect.json --out gen-app > /dev/null
          must 'ORACLE_CDB_SERVICE=orcl' gen-app/host.env
          # v0.8.0: a NON-CDB database (local user + services.oracle.non_cdb): the oracle_db block must start too
          sed -e 's/C##OTEL_MON/otel_mon/' -e 's/^\( *\)cdb_service:.*/\1non_cdb: true/' examples/app-host/answers.yaml > noncdb.yaml
          must 'non_cdb: true' noncdb.yaml
          echo "::group::plan with a non-CDB database"
          sudo $amc plan --answers noncdb.yaml --detect-json examples/app-host/detect.json | tee plan-noncdb.txt
          echo "::endgroup::"
          must 'validate: VALID' plan-noncdb.txt
          must 'no load / start errors' plan-noncdb.txt
          $amc generate --answers noncdb.yaml --detect-json examples/app-host/detect.json --out gen-noncdb > /dev/null
          must 'ORACLE_NONCDB=on' gen-noncdb/host.env
          if grep -q 'ORACLE_CDB_SERVICE' gen-noncdb/host.env; then die "non-CDB: no CDB root checks expected"; fi
          # Tomcat started by systemd (v0.3.0): daily JULI files + renamed access log, two includes in one receiver.
          echo "::group::plan with a systemd Tomcat (daily log files)"
          sudo $amc plan --answers examples/tomcat-systemd/answers.yaml --detect-json examples/tomcat-systemd/detect.json | tee plan-juli.txt
          echo "::endgroup::"
          must 'validate: VALID' plan-juli.txt
          must 'no load / start errors' plan-juli.txt
          if grep -q 'DEFAULT' plan-juli.txt; then die "systemd Tomcat: logs were found, no DEFAULT expected"; fi
          # Interactive on a REAL terminal (script = pseudo-tty, so /dev/tty works as over SSH): Enter for the
          # project and the service list, a PDB name, Enter for user + non-CDB + HTTP checks + 2 Tomcat log paths,
          # then "n" for "Apply now?".
          echo "::group::interactive plan (pseudo-terminal)"
          printf '\n\napppdb\n\n\n\n\n\nn\n' | sudo script -qec "$amc plan --detect-json examples/app-host/detect.json" /dev/null | tee interactive.txt
          echo "::endgroup::"
          must 'Project \[-\]' interactive.txt
          must 'Tomcat access log \[/opt/tomcat/logs/localhost_access_log' interactive.txt
          must 'Monitor \[oracle, redis, tomcat\]?' interactive.txt
          must 'Oracle service name \[orcl\]' interactive.txt
          must 'NEW    answers.yaml' interactive.txt
          must 'CHECK done: 0 failures' interactive.txt
          must 'Apply now?' interactive.txt
          if grep -q '^DONE:' interactive.txt; then die "answered n to Apply now, but it applied"; fi
          [ ! -e /opt/monitoring/answers.yaml ] || die "plan wrote answers.yaml"
          echo "::group::apply --start"
          sudo $amc apply --host-dir examples/oracle-db --start | tee apply.txt
          echo "::endgroup::"
          must 'monitoring-otelcol.service active' apply.txt
          must 'monitoring-netconn.service active' apply.txt
          must 'monitoring-kmsg.service active' apply.txt
          systemctl is-active monitoring-otelcol monitoring-netconn monitoring-kmsg || die "units not active"
          # v0.5.0 end to end: a kernel message (priority 3) must reach the helper's file within seconds
          sleep 3
          # (journald takes "amc-ci:" as the program name and strips it from MESSAGE)
          echo "<3>amc-ci: Out of memory: Killed process 4242 (ci-test)" | sudo tee /dev/kmsg > /dev/null
          for i in $(seq 1 20); do sudo grep -qs 'Killed process 4242 (ci-test)' /opt/monitoring/data/kmsg/kmsg-*.jsonl && break; sleep 1; done
          f=$(sudo sh -c 'ls /opt/monitoring/data/kmsg/kmsg-*.jsonl | head -1')
          echo "kmsg file: $(sudo stat -c '%A %U:%G' "$f")"; sudo getfacl -p "$f" /opt/monitoring/data/kmsg /opt/monitoring/data /opt 2>/dev/null | grep -vE '^$'
          case "$(sudo stat -c %A "$f")" in ????????w?) die "kmsg file is world-writable";; esac
          # v0.10.1: the netconn helper sets its file mode itself too (the runner's default ACL on /opt gives other::rwx)
          for i in $(seq 1 40); do sudo sh -c 'ls /opt/monitoring/data/netconn/netconn-*.jsonl' > /dev/null 2>&1 && break; sleep 1; done
          m=$(sudo sh -c 'stat -c %A /opt/monitoring/data/netconn/netconn-*.jsonl' | head -1); echo "netconn file: $m"
          case "$m" in '') die "no netconn file";; ????????w?) die "netconn file is world-writable";; esac
          if ! sudo grep -qs 'Killed process 4242 (ci-test)' /opt/monitoring/data/kmsg/kmsg-*.jsonl; then
            echo "--- unit"; systemctl status monitoring-kmsg --no-pager | tail -15
            echo "--- data dir"; sudo ls -la /opt/monitoring/data/kmsg
            echo "--- root: last kernel messages"; sudo journalctl -k -n 3 --no-pager -o json --output-fields=MESSAGE,PRIORITY
            echo "--- helper processes"; ps -eo pid,user,args | grep -E '[j]ournalctl|[o]tel-kmsg'
            for p in $(pgrep -f 'journalctl -k'); do echo "pid $p"; grep -E '^(Uid|Gid|Groups)' /proc/$p/status; done
            die "kernel message not captured by monitoring-kmsg"
          fi
          # v0.6.0 end to end: a CPU burner must show up in the top-processes file with cpu_pct > 50 (15 s window)
          must 'monitoring-procs.service active' apply.txt
          # (the helper samples every 60 s: burn longer than one interval + window)
          timeout 100 bash -c 'exec -a amcburn bash -c "while :; do :; done"' &
          ok=""
          for i in $(seq 1 100); do
            if sudo sh -c 'cat /opt/monitoring/data/procs/procs-*.jsonl 2>/dev/null' | python3 -c '
          import json, sys
          rows = [json.loads(l) for l in sys.stdin if l.strip()]
          sys.exit(0 if any(r["cpu_pct"] > 50 and "cpu" in r["top"] for r in rows) else 1)'; then ok=1; break; fi
            sleep 1
          done
          [ -n "$ok" ] || { sudo sh -c 'tail -5 /opt/monitoring/data/procs/procs-*.jsonl'; die "CPU burner not in the top-processes file"; }
          sudo sh -c 'cat /opt/monitoring/data/procs/procs-*.jsonl' | grep -q '"args"' && die "process arguments written"
          case "$(sudo sh -c 'stat -c %A /opt/monitoring/data/procs/procs-*.jsonl' | head -1)" in ????????w?) die "procs file is world-writable";; esac
          # v0.7.0 end to end: sshd login lines (via logger -t sshd) arrive; an unknown user name (here a "password")
          # is masked before it is written; other services' lines are not read. As root (like the real sshd): a normal
          # user's logger lines go to that user's own journal file
          must 'monitoring-sshd.service active' apply.txt
          sleep 3
          sudo logger -t sshd "Accepted publickey for ciuser from 192.0.2.10 port 4242 ssh2"
          sudo logger -t sshd "Invalid user Sup3rS3cretPw from 192.0.2.11 port 4243"
          sudo logger -t sshd "Failed password for invalid user Sup3rS3cretPw from 192.0.2.11 port 4243 ssh2"
          sudo logger -t sshd "Connection closed by invalid user Sup3rS3cretPw 192.0.2.11 port 4243 [preauth]"
          sudo logger -t sshd "Server listening on 0.0.0.0 port 22."
          sudo logger -t sudo "ciuser : COMMAND=/usr/bin/echo SudoSecret123"
          for i in $(seq 1 20); do sudo sh -c 'grep -qs "Connection closed by invalid user" /opt/monitoring/data/sshd/sshd-*.jsonl' && break; sleep 1; done
          # robustness: after a journal rotation both journal helpers still capture new lines (cursor polling; a
          # long-running journalctl -f missed lines after the journal changed, seen 2026-10-08)
          sudo journalctl --rotate; sleep 2
          sudo logger -t sshd "Accepted publickey for rotprobe from 192.0.2.98 port 1 ssh2"
          echo "<3>amcrot: kernel line after rotation" | sudo tee /dev/kmsg > /dev/null
          for i in $(seq 1 25); do sudo sh -c 'grep -qs rotprobe /opt/monitoring/data/sshd/sshd-*.jsonl && grep -qs "kernel line after rotation" /opt/monitoring/data/kmsg/kmsg-*.jsonl' && break; sleep 1; done
          sudo sh -c 'grep -qs rotprobe /opt/monitoring/data/sshd/sshd-*.jsonl' || die "sshd line after a journal rotation not captured"
          sudo sh -c 'grep -qs "kernel line after rotation" /opt/monitoring/data/kmsg/kmsg-*.jsonl' || die "kernel line after a journal rotation not captured"
          if ! sudo sh -c 'grep -qs "Accepted publickey for ciuser from 192.0.2.10" /opt/monitoring/data/sshd/sshd-*.jsonl'; then
            echo "--- unit"; systemctl status monitoring-sshd --no-pager | tail -12; sudo journalctl -u monitoring-sshd --no-pager | tail -10
            echo "--- journal -t sshd (root)"; sudo journalctl -t sshd -t sshd-session -n 8 -o cat --no-pager
            echo "--- helper --stdout as the collector user"; sudo runuser -u otelcol-contrib -g otelcol-contrib -G systemd-journal -- /opt/monitoring/netconn/otel-sshd.sh --stdout
            echo "--- data dir"; sudo ls -la /opt/monitoring/data/sshd
            die "accepted login not captured"
          fi
          sudo sh -c 'cat /opt/monitoring/data/sshd/sshd-*.jsonl'
          [ "$(sudo sh -c 'grep -c "invalid user \*\*\*" /opt/monitoring/data/sshd/sshd-*.jsonl' || true)" -ge 2 ] || die "unknown user not masked"
          if sudo sh -c 'grep -qs "Sup3rS3cretPw\|SudoSecret123\|Server listening" /opt/monitoring/data/sshd/sshd-*.jsonl'; then die "secret / non-login line written"; fi
          # the collector process itself must NOT be in the journal group (only the helper unit is)
          pid=$(systemctl show -p MainPID --value monitoring-otelcol)
          ! grep -q "^Groups:.*\b$(getent group systemd-journal | cut -d: -f3)\b" /proc/$pid/status || die "collector has journal access"
          # detect on the real /proc: the live collector's OTLP port must be seen, the JSON must parse
          sudo $amc detect
          sudo $amc detect --json | python3 -c 'import json,sys; d=json.load(sys.stdin); assert 4317 in d["listening_ports"], d' \
            || die "detect did not see the collector port 4317"
          sudo runuser -u otelcol-contrib -- test -r "$alert" || die "alert log not readable for the collector"
          if id -nG otelcol-contrib | grep -qwE 'root|sudo|adm'; then die "collector user in an admin group"; fi
          echo "::group::plan again (must be unchanged)"
          sudo $amc plan --host-dir examples/oracle-db | tee plan2.txt
          echo "::endgroup::"
          if grep -E '^  (CHANGE|NEW|REMOVE) ' plan2.txt; then die "second plan is not clean"; fi
          must 'CHECK done: 0 failures' plan2.txt
          # plan2 ran its smoke collector NEXT TO the live one: no port conflict, live collector untouched
          must 'no load / start errors' plan2.txt
          systemctl is-active monitoring-otelcol || die "the smoke run disturbed the live collector"
          # Broken update: OTLP on 1521 (held by the fake listener). validate passes (it binds nothing), the
          # smoke run is skipped -> the collector really fails to start -> amc must roll back.
          echo "::group::broken update (must roll back)"
          cp -r examples/oracle-db broken && mkdir -p broken/site.d
          printf 'receivers:\n  otlp:\n    protocols:\n      grpc:\n        endpoint: 127.0.0.1:1521\n' > broken/site.d/99-broken.yaml
          set +e; sudo $amc apply --host-dir broken --start --no-smoke | tee broken.txt; rc=${PIPESTATUS[0]}; set -e
          echo "::endgroup::"
          [ "$rc" -eq 1 ] || die "a rolled-back apply must exit 1 (got $rc)"
          must 'ROLLED BACK' broken.txt
          must 'rolled back: the previous state runs again' broken.txt
          systemctl is-active monitoring-otelcol || die "previous state not running after the rollback"
          [ ! -e /opt/monitoring/config/site.d/99-broken.yaml ] || die "the broken file survived the rollback"
          sudo $amc plan --host-dir examples/oracle-db --no-smoke | tee plan3.txt
          if grep -E '^  (CHANGE|NEW|REMOVE) ' plan3.txt; then die "after the rollback the host is not back to the good state"; fi
          # v0.9.0 end to end: access log lines -> signal_to_metrics -> delta_to_cumulative -> metrics OUT of the real
          # collector (file exporter instead of the backend). The live collector is stopped meanwhile (same ports);
          # the test collector keeps its queue in /tmp (no root-owned files in the live data dir).
          echo "::group::HTTP metrics from the access log"
          $amc generate --answers examples/tomcat-systemd/answers.yaml --detect-json examples/tomcat-systemd/detect.json --out gen-http > /dev/null
          must 'signal_to_metrics/http' gen-http/host.yaml
          sudo install -d /opt/tomcat10/logs /tmp/http-e2e/fs
          acc=/opt/tomcat10/logs/access_log.$(date +%F).log
          sudo touch "$acc"
          printf 'extensions:\n  file_storage:\n    directory: /tmp/http-e2e/fs\nexporters:\n  file/http:\n    path: /tmp/http-e2e/metrics.json\nservice:\n  pipelines:\n    metrics/http:\n      receivers: [signal_to_metrics/http]\n      processors: [delta_to_cumulative, batch]\n      exporters: [file/http]\n' > http-overlay.yaml
          sudo systemctl stop monitoring-otelcol
          sudo bash -c "set -a; . gen-http/host.env; OO_ENDPOINT=http://127.0.0.1:9; OO_AUTH=x; ORACLE_MON_PASSWORD=x; set +a; \
            exec /opt/monitoring/bin/otelcol-contrib --config assets/config/config.yaml --config gen-http/host.yaml --config http-overlay.yaml" > http-col.log 2>&1 &
          sleep 6   # start_at: end -> write the lines after the collector is up
          for i in 1 2 3; do
            printf '10.0.0.%s - - [%s] "GET /app/a HTTP/1.1" 200 512 40\n10.0.0.%s - - [%s] "POST /app/b HTTP/1.1" 500 99 1200\n' \
              "$i" "$(date '+%d/%b/%Y:%H:%M:%S %z')" "$i" "$(date '+%d/%b/%Y:%H:%M:%S %z')" | sudo tee -a "$acc" > /dev/null
            sleep 2
          done
          for i in $(seq 1 30); do sudo grep -qs 'tomcat.access.duration' /tmp/http-e2e/metrics.json && break; sleep 1; done
          sudo pkill -f 'http-overlay.yaml' || true
          sleep 2
          echo "::endgroup::"
          sudo test -s /tmp/http-e2e/metrics.json || { tail -40 http-col.log; die "no metrics written by the connector"; }
          sudo cat /tmp/http-e2e/metrics.json | python3 -c '
          import json, sys
          seen = {}
          for line in sys.stdin:
              for rm in json.loads(line).get("resourceMetrics", []):
                  for sm in rm.get("scopeMetrics", []):
                      for m in sm.get("metrics", []):
                          for kind in ("sum", "histogram"):
                              for dp in m.get(kind, {}).get("dataPoints", []):
                                  attrs = {a["key"]: a["value"].get("stringValue") for a in dp.get("attributes", [])}
                                  seen.setdefault(m["name"], []).append((kind, m.get(kind, {}).get("aggregationTemporality"), attrs, dp))
          req = seen.get("tomcat.access.requests", [])
          dur = seen.get("tomcat.access.duration", [])
          assert req, "no tomcat.access.requests"
          assert {d[2].get("status_class") for d in req} >= {"2", "5"}, "status_class 2 and 5 expected: %s" % [d[2] for d in req]
          assert all(d[1] == 2 for d in req), "requests must be CUMULATIVE (2) after delta_to_cumulative: %s" % [d[1] for d in req]
          assert max(int(d[3].get("asInt", d[3].get("asDouble", 0))) for d in req) >= 3, "counter must accumulate"
          assert dur and dur[0][0] == "histogram" and "bucketCounts" in dur[-1][3], "tomcat.access.duration histogram missing"
          print("HTTP metrics OK:", sorted(seen), "points", len(req), len(dur))
          ' || { tail -40 http-col.log; die "HTTP metrics from the access log are wrong"; }
          if grep -q 'is deprecated' http-col.log; then grep 'is deprecated' http-col.log; die "deprecated component name in the generated config"; fi
          sudo systemctl start monitoring-otelcol
          for i in $(seq 1 20); do systemctl is-active -q monitoring-otelcol && break; sleep 1; done
          systemctl is-active monitoring-otelcol || die "live collector did not come back after the HTTP metrics test"
          # v0.10.0 end to end: amc update = a new release on an installed host without copying files (saved
          # answers.yaml + the installed site.d). An up-to-date host must NOT be restarted (same MainPID).
          echo "::group::amc update"
          set +e; sudo $amc update --no-smoke > upd0.txt 2>&1; rc=$?; set -e; cat upd0.txt
          { [ "$rc" -eq 2 ] && grep -q 'answers.yaml is missing' upd0.txt; } || die "update without saved answers must stop (exit 2, got $rc)"
          td=examples/tomcat-systemd
          mkdir -p site-upd && printf 'processors:\n  batch/ci_update: {}\n' > site-upd/10-ci.yaml
          sudo $amc apply --answers $td/answers.yaml --detect-json $td/detect.json --site-dir site-upd --start | tee upd1.txt
          must 'monitoring-otelcol.service active' upd1.txt
          { sudo test -s /opt/monitoring/answers.yaml && sudo test -s /opt/monitoring/config/site.d/10-ci.yaml; } || die "answers / site.d not installed"
          pid=$(systemctl show -p MainPID --value monitoring-otelcol)
          sudo $amc update --detect-json $td/detect.json | tee upd2.txt
          must 'up to date: nothing to change, nothing restarted' upd2.txt
          [ "$(systemctl show -p MainPID --value monitoring-otelcol)" = "$pid" ] || die "an up-to-date update restarted the collector"
          sudo test -s /opt/monitoring/config/site.d/10-ci.yaml || die "update removed the installed site.d"
          # a changed saved answer (stands for a release with a changed template): --plan changes nothing, then apply
          sudo sed -i 's/^project: Shop online$/project: Shop update/' /opt/monitoring/answers.yaml
          sudo $amc update --plan --detect-json $td/detect.json | tee upd3.txt
          must 'change(s) planned' upd3.txt
          [ "$(systemctl show -p MainPID --value monitoring-otelcol)" = "$pid" ] || die "update --plan restarted the collector"
          sudo $amc update --detect-json $td/detect.json | tee upd4.txt
          must 'DONE: 0 failure' upd4.txt
          sudo grep -q 'project=Shop+update' /opt/monitoring/config/host.env || die "update did not apply the saved answers"
          sudo test -s /opt/monitoring/config/site.d/10-ci.yaml || die "update removed the installed site.d"
          systemctl is-active monitoring-otelcol || die "collector not active after the update"
          # v0.10.1: a new installer with an identical configuration (only VERSION differs): written, NOT restarted
          sudo sed -i 's/^installer=.*/installer=amc older/' /opt/monitoring/VERSION
          pid=$(systemctl show -p MainPID --value monitoring-otelcol)
          sudo $amc update --detect-json $td/detect.json | tee upd5.txt
          must 'collector NOT restarted' upd5.txt
          [ "$(systemctl show -p MainPID --value monitoring-otelcol)" = "$pid" ] || die "a VERSION-only update restarted the collector"
          if sudo grep -q 'installer=amc older' /opt/monitoring/VERSION; then die "VERSION not written"; fi
          if grep -q 'Run `amc apply`' upd2.txt upd3.txt upd5.txt; then die "update printed the engine's amc apply hint"; fi
          echo "::endgroup::"
          # Uninstall: check mode first (must change nothing), then everything; afterwards nothing of amc is left.
          echo "::group::uninstall"
          grep -q '"/u01/app/oracle/diag/rdbms/orcl/ORCL/trace/alert_ORCL.log"' /opt/monitoring/amc-state.json || die "ACL not recorded"
          sudo $amc uninstall | tee un1.txt
          must 'CHECK done' un1.txt
          systemctl is-active monitoring-otelcol || die "uninstall check mode stopped the collector"
          sudo $amc uninstall --yes --purge-data --purge-secrets --purge < /dev/null | tee un2.txt  # no tty: flags confirm
          echo "::endgroup::"
          must 'UNINSTALLED: 0 failure' un2.txt
          if systemctl is-active -q monitoring-otelcol; then die "collector still running"; fi
          [ ! -e /etc/systemd/system/monitoring-otelcol.service ] || die "unit link left"
          [ ! -e /opt/monitoring ] || die "/opt/monitoring left"
          if id otelcol-contrib 2>/dev/null; then die "collector user left"; fi
          for p in "$alert" /u01 /u01/app/oracle/diag/rdbms/orcl/ORCL/trace; do
            if sudo getfacl -p --omit-header "$p" | grep -E '^user:[^:]+:'; then die "ACL entry left on $p"; fi
          done
          [ "$(sudo stat -c %a "$alert")" = 640 ] || die "file mode of the alert log changed"
      - name: No secrets (gitleaks, full history)
        run: |
          v=8.18.4; b=https://github.com/gitleaks/gitleaks/releases/download/v$v
          curl -fsSLO "$b/gitleaks_${v}_linux_x64.tar.gz" -fsSLO "$b/gitleaks_${v}_checksums.txt"
          grep " gitleaks_${v}_linux_x64.tar.gz$" "gitleaks_${v}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${v}_linux_x64.tar.gz" gitleaks
          ./gitleaks detect --source . --no-banner --redact -v
