# CI: every push and pull request. No secrets needed.
name: ci
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: No CRLF (scripts and configs go to Linux servers)
        run: |
          bad=$(git ls-files --eol | awk '$1 ~ /crlf/ || $2 ~ /crlf/ {print $NF}')
          [ -z "$bad" ] || { echo "CRLF in: $bad"; exit 1; }
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          [ -z "$out" ] || { echo "run gofmt on: $out"; exit 1; }
      - name: vet + test
        run: |
          go vet ./...
          go test -race ./...
      - name: Build static binaries (linux amd64 + arm64)
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "dist/amc-linux-$arch" ./cmd/amc
          done
          file dist/*
          ./dist/amc-linux-amd64 version
      - name: End to end on this runner (real collector, systemd, ACLs; fake backend and secrets)
        run: |
          sudo apt-get install -y -qq acl > /dev/null
          alert=/u01/app/oracle/diag/rdbms/orcl/ORCL/trace/alert_ORCL.log
          sudo install -d -m 750 "$(dirname "$alert")" && echo "2026-10-05T10:00:00.000000+00:00" | sudo tee "$alert" > /dev/null
          sudo chmod 640 "$alert"                         # root only: amc must grant the collector an ACL
          sudo install -d -m 700 /opt/monitoring/secrets
          printf "OO_ENDPOINT='http://127.0.0.1:9'\nOO_AUTH='Basic fake'\nORACLE_MON_PASSWORD='123456'\n" \
            | sudo tee /opt/monitoring/secrets/collector.env > /dev/null
          sudo chmod 600 /opt/monitoring/secrets/collector.env
          # Every check stops the job on its own line: in `bash -e` a failure inside `a && b` does NOT stop the
          # script (the first version of this step went green although validate had failed).
          set -euo pipefail
          die()  { echo "::error::$*"; exit 1; }
          must() { grep -q -- "$1" "$2" || die "missing '$1' in $2"; }
          amc=./dist/amc-linux-amd64
          echo "::group::plan (check mode)"
          sudo $amc plan --host-dir examples/oracle-db | tee plan1.txt   # pipefail: amc's exit code counts
          echo "::endgroup::"
          must 'validate: VALID' plan1.txt
          must 'CHECK done: 0 failures' plan1.txt
          if [ -e /etc/systemd/system/monitoring-otelcol.service ] || [ -e /opt/monitoring/config ]; then die "plan changed the system"; fi
          echo "::group::apply --start"
          sudo $amc apply --host-dir examples/oracle-db --start | tee apply.txt
          echo "::endgroup::"
          must 'monitoring-otelcol.service active' apply.txt
          must 'monitoring-netconn.service active' apply.txt
          systemctl is-active monitoring-otelcol monitoring-netconn || die "units not active"
          sudo runuser -u otelcol-contrib -- test -r "$alert" || die "alert log not readable for the collector"
          if id -nG otelcol-contrib | grep -qwE 'root|sudo|adm'; then die "collector user in an admin group"; fi
          echo "::group::plan again (must be unchanged)"
          sudo $amc plan --host-dir examples/oracle-db | tee plan2.txt
          echo "::endgroup::"
          if grep -E '^  (CHANGE|NEW|REMOVE) ' plan2.txt; then die "second plan is not clean"; fi
          must 'CHECK done: 0 failures' plan2.txt
      - name: No secrets (gitleaks, full history)
        run: |
          v=8.18.4; b=https://github.com/gitleaks/gitleaks/releases/download/v$v
          curl -fsSLO "$b/gitleaks_${v}_linux_x64.tar.gz" -fsSLO "$b/gitleaks_${v}_checksums.txt"
          grep " gitleaks_${v}_linux_x64.tar.gz$" "gitleaks_${v}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${v}_linux_x64.tar.gz" gitleaks
          ./gitleaks detect --source . --no-banner --redact -v
