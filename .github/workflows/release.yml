# Release: push a tag v*  ->  all CI checks  ->  static monitoring-agent binaries (+ the same as amc-linux-*) + monitoring-collector (OCB, amd64 + arm64) + get.sh +
# SHA256SUMS + signature.
#   git tag -a v0.1.0 -m "..." && git push origin v0.1.0
# The tag must be on main. SHA256SUMS is signed with the key in the secret AMC_SIGNING_KEY (ECDSA P-256 PEM) and
# checked against keys/release.pub BEFORE anything is published: a wrong or swapped secret = no release.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 40   # cold OCB builds of monitoring-collector (amd64 + arm64) ~11 + ~4 min
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Tag must be on main
        run: |
          git fetch -q origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - name: Build
        run: |
          set -euo pipefail
          pkg=github.com/NABIXcorp/auto-mon-collector/internal/version
          ld="-s -w -X $pkg.Version=$GITHUB_REF_NAME -X $pkg.Commit=$(git rev-parse --short HEAD) -X $pkg.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "$ld" -o "dist/monitoring-agent-linux-$arch" ./cmd/monitoring-agent
            # the same binary under the name before v0.20.0: an older `amc self-update` / get.sh looks for amc-linux-<arch>
            cp "dist/monitoring-agent-linux-$arch" "dist/amc-linux-$arch"
          done
          scripts/render-get.sh keys/release.pub dist/get.sh
          (cd dist && sha256sum monitoring-agent-linux-amd64 monitoring-agent-linux-arm64 amc-linux-amd64 amc-linux-arm64 get.sh > SHA256SUMS && cat SHA256SUMS)
          ./dist/monitoring-agent-linux-amd64 version
      - uses: actions/setup-go@v6   # the collector needs the newer Go of its own modules (same as the CI job)
        with:
          go-version-file: collector/receiver/netconnreceiver/go.mod
          cache-dependency-path: collector/receiver/*/go.sum
      - name: Build monitoring-collector (OCB, linux amd64 + arm64, static)
        run: |
          set -euo pipefail
          v=$(awk '/^  version:/ {print $2}' collector/builder-config.yaml)
          go install "go.opentelemetry.io/collector/cmd/builder@v$v"
          for arch in amd64 arm64; do   # amc v0.19.0+ installs it on every host: both architectures amc supports
            (cd collector && CGO_ENABLED=0 GOOS=linux GOARCH=$arch builder --config builder-config.yaml)
            cp collector/_build/monitoring-collector "dist/monitoring-collector-linux-$arch"
          done
          ./dist/monitoring-collector-linux-amd64 --version
          ./dist/monitoring-collector-linux-amd64 validate --config collector/testdata/smoke.yaml
          file dist/monitoring-collector-linux-arm64 | grep -q 'ARM aarch64' || { echo "::error::arm64 build is not aarch64"; exit 1; }
          (cd dist && sha256sum monitoring-collector-linux-amd64 monitoring-collector-linux-arm64 >> SHA256SUMS && cat SHA256SUMS)
      - name: Sign SHA256SUMS and verify against the committed public key
        env:
          AMC_SIGNING_KEY: ${{ secrets.AMC_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [ -n "$AMC_SIGNING_KEY" ] || { echo "::error::secret AMC_SIGNING_KEY is not set"; exit 1; }
          umask 077
          key=$(mktemp); trap 'rm -f "$key"' EXIT
          printf '%s\n' "$AMC_SIGNING_KEY" > "$key"
          openssl dgst -sha256 -sign "$key" -out dist/SHA256SUMS.sig dist/SHA256SUMS
          openssl dgst -sha256 -verify keys/release.pub -signature dist/SHA256SUMS.sig dist/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/monitoring-agent-linux-amd64 dist/monitoring-agent-linux-arm64 \
            dist/amc-linux-amd64 dist/amc-linux-arm64 \
            dist/monitoring-collector-linux-amd64 dist/monitoring-collector-linux-arm64 \
            dist/get.sh dist/SHA256SUMS dist/SHA256SUMS.sig \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
